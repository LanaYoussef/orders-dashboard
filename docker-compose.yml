services:
  php:
    build: .
    env_file:
      - .env
    volumes:
      - .:/var/www/html

  caddy:
    image: caddy:latest
    volumes:
      - .:/var/www/html
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8080:80"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: users
    ports:
      - "5432:5432"
