services:
  php:
    build: .
    env_file:
      - .env
    extra_hosts:
      - "api.openweathermap.org:141.95.47.139"
    volumes:
      - .:/var/www/html

  caddy:
    image: caddy:latest
    volumes:
      - .:/var/www/html
      - ./Caddyfile:/etc/caddy/Caddyfile
    environment:
      - WS_PORT=${WS_PORT}
    ports:
      - "8080:80"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql

  websocket:
    build: .
    command: php /var/www/html/api/websocket.php start
    env_file:
      - .env
    volumes:
      - .:/var/www/html

volumes:
  postgres_data:
